name: DORA бақылауы
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'
permissions:
  contents: read
  actions: read
  issues: read
  deployments: read
jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install matplotlib==3.10.8
      - run: python scripts/collect_dora.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: dora-${{ github.run_id }}
          path: docs/lab10/data/
          if-no-files-found: error
          retention-days: 30
